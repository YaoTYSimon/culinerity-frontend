<!doctype html>
<html lang="en" data-theme="tobacco">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Culinerity</title>
    <meta name="description" content="Cheaper, healthier swaps for what you crave, for anyone in Melbourne." />
    <meta name="theme-color" content="#472913" />
    <script>
      // Runs before first paint so the chosen theme never flashes. Keep ids/key in step with @culinerity/core and localThemeStore.ts.
      (function () {
        var themes = { tobacco: '#472913', sand: '#ddd6c6', walnut: '#2b2216', cream: '#f6efe6', ink: '#14202e', sage: '#e3eadb', clay: '#3a1f18', sunrise: '#fbe6d6', mono: '#000000' };
        try {
          var id = localStorage.getItem('culinerity.theme.v1');
          if (Object.prototype.hasOwnProperty.call(themes, id)) {
            document.documentElement.dataset.theme = id;
            document.querySelector('meta[name="theme-color"]').setAttribute('content', themes[id]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
